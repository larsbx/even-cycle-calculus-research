id = "COORDINATE-BRIDGE-CONTROLS"
status = "computed"
statement = "An edge-preserving C4-to-K2 fold creates traversal collisions. Two injective assignments into three vertices can produce the same trace if a label is unvisited."
authority = "proof/coordinate-collision-bridge.md"
evidence = "formal/CollisionControls.lean"
formal_verification = "Six finite declarations checked by Lean/Std 4.34.0-rc2; standard propext/Quot.sound only, or no axioms."
independent_acceptance = "formal counterexamples under explicit hypotheses, not full formula acceptance"

