[[claim]]
id = "FINITE-COORDINATE-COLLISION-BRIDGE"
status = "working"
statement = "For finite coordinate label sets, injective factor assignments preserve and reflect equality, single-coordinate changes, traversal injectivity and used support. Edge-preserving assignments decode a prescribed closed label walk to a simple cycle iff that shape is simple. A fixed shape visiting all labels uniquely determines its assignments."
authority = "proof/coordinate-collision-bridge.md"
evidence = "formal/CollisionBridge.lean"
formal_verification = "Eight general declarations checked by Lean/Std 4.34.0-rc2; four depend on standard Quot.sound via function extensionality and four on no axioms. Exact declaration audit in formal/check.py."
independent_acceptance = "kernel-checked specified components; full c8 theorem and external mathematical acceptance remain separate"

