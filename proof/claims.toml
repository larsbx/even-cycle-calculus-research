[[claim]]
id = "CLOSED-COORDINATE-WALK-REALIZATION"
status = "working"
statement = "For finite coordinate vertex sets, an axis word and destination queues realize a unique closed Cartesian walk from a fixed root iff their lengths are compatible and every queue follows changing factor edges and closes at that root coordinate. The m departures are exactly the m+1 replay vertices with their final endpoint removed, and their distinctness is equivalent to trace injectivity."
authority = "proof/closed-coordinate-walks.md"
evidence = "formal/ClosedWalk.lean"
formal_verification = "19 general Lean/Std declarations with exact propext or propext/Quot.sound audits. Arbitrary edge relations are permitted with changes required explicitly. CycleTrace supplies modular cycle adjacency and ExecutableTrace supplies bounded-template executable correspondence; complete extraction/template assembly and ordinary-cycle cardinality remain open."
independent_acceptance = "kernel-checked specified closed-walk component; full c8 formula and external mathematical acceptance remain separate"

